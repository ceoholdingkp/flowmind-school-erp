# ═══════════════════════════════════════════════════════════════
# Flowmind School ERP — Docker Compose (Development)
# Ejecutar: docker compose up -d
# ═══════════════════════════════════════════════════════════════

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowmind-school-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: flowmind_dev_2026
      POSTGRES_DB: flowmind_master
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-tenant-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowmind-school-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: flowmind-school-s3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: flowmind
      MINIO_ROOT_PASSWORD: flowmind_dev_2026
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
